function detectPax(t) {
  let s = " " + t.replace(/[^\w\s'-]/g, " ") + " ";
  s = s.replace(/\b([a-z]+)\b/g, (w) => (NUMS[w] != null ? String(NUMS[w]) : w));
  const nouns = [...s.matchAll(new RegExp("\\b(\\d{1,3})\\s+(?:[a-z]+\\s+)?(" + PEOPLE + ")\\b", "g"))].map((m) => ({ n: +m[1], how: m[0].trim() }));
  const lead = [...s.matchAll(/\b(?:somos|seremos|seriamos|we are|we're|group of|party of|grupo de)\s+(\d{1,3})\b/g)].map((m) => ({ n: +m[1], how: m[0].trim() }));
  let best = [...nouns, ...lead].filter((x) => x.n > 0 && x.n < 200).sort((a, b) => b.n - a.n)[0] || null;
  if (/\b(my wife|my husband|mi mujer|mi marido|mi pareja|my partner)\b/.test(s)) {
    const kids = s.match(/\b(\d{1,2})\s+(?:[a-z]+\s+)?(kids|children|ninos|hijos)\b/);
    const fam = { n: 2 + (kids ? +kids[1] : 0), how: kids ? "couple + " + kids[1] + " kids" : "couple" };

  return best;
}
function langOf(text) {

  return en >= es ? "en" : "es";

  const lang = langOf(text);
  const discount = /discount|descuento|rebaja|cheaper|mas barato/.test(t);

  let profile;
  if (refuses && (geoFail || night || capFail)) profile = "lost";
  else if (vip.length > seat.length || (pax != null && pax >= 8 && seat.length === 0 && !discount)) profile = "vip";
  else profile = "seat";

  const nAlerts = [geoFail, capFail, night].filter(Boolean).length;
  let score = profile === "vip" ? 86 + Math.min(12, vip.length * 3) : profile === "seat" ? 58 + Math.min(20, seat.length * 4) : 18;
  score -= nAlerts * 9 + (discount ? 25 : 0);
  if (profile === "lost") score = clamp(score, 5, 45);
  score = clamp(Math.round(score), 5, 99);

  const dest = out[0] ? cap1(out[0]) : "";
  const alerts = {
    capacity: { label: "Maximum capacity: 11 pax", ok: !capFail, detail: capFail ? `${pax} passengers requested. Maritime law caps the Fjord 38 at 11 + captain → 2-boat tandem growth hack, close on WhatsApp.` : pax != null ? `${pax} of 11 seats.` : "Group size not stated. Ask in the reply." },
    overnight: { label: "0 overnight stays", ok: !night, detail: night ? "Asks to sleep on board. Not allowed: 8-hour day charter." : "No overnight request." },
    geo: { label: "Ibiza & Formentera only", ok: !geoFail, detail: geoFail ? `Destination out of range: ${out.map(cap1).join(", ")}. Reroute to Es Vedrà or Illetes.` : inz.length ? `Within range (${inz.join(", ")}).` : "No destination given. Suggest Es Vedrà or Illetes." }
  };

  const bits = [pax != null ? `Group of ${pax}` : "Group size unknown"];
  if (geoFail) bits.push(`wants to sail to ${dest}`); else if (inz.length) bits.push(`interested in ${inz.join(", ")}`);
  if (night) bits.push("wants to stay overnight");
  if (discount) bits.push("asks for a discount");
  if (vip.length) bits.push(`premium signals (${vip.slice(0, 3).join(", ")})`);
  if (seat.length && !vip.length) bits.push("price-per-seat shopper");

  const suggestion = [];
  if (capFail) suggestion.push("Offer a second boat sailing in tandem and hand the close to the team on WhatsApp today.");
  if (geoFail) suggestion.push("Reroute to the premium Es Vedrà sunset or Illetes (Formentera) instead of losing the lead.");
  if (night) suggestion.push("Replace the overnight with a sunset finish and a tender transfer back to the villa.");
  if (profile === "vip") suggestion.push(`Pitch the VIP Membership (${eur(MEMBERSHIP_FEE)} / season): member rates from ${eur(MEMBER_FROM)} per seat, no 40% surcharge, priority on the Founders Run.`, "If they stay in a villa, log the B2B villa partner for commission and repeat outings.");
  if (profile === "seat") suggestion.push("Sell seats on the next departure: 2 concrete dates and the day-pass price.", "Use real scarcity (seats left) and close payment in the chat. Upsell membership after the trip.");
  if (profile === "lost") suggestion.push("Close politely and move to newsletter nurture. No more sales time.");

  return { source: "rules", lang, profile, pax, score, paxDetail: paxInfo ? `Detected from “${paxInfo.how}”.` : "Not stated in the message.", summary: bits.join("; ") + ".", alerts, suggestion, reply: buildReply(lang, profile, { pax, dest, capFail, geoFail, night }), whatsapp: capFail };
}

function buildReply(lang, profile, c) {
  const p = [];
  if (lang === "es") {
    p.push("¡Hola! Gracias por escribirnos.");
    if (c.capFail) p.push(`Eso no es posible debido a la normativa marítima, que limita el barco a 11 pasajeros más el capitán, pero puedo ofrecerte un segundo barco navegando en tándem para que vuestro grupo de ${c.pax} vaya junto. El equipo te pasa los detalles por WhatsApp.`);
    if (c.geoFail) p.push(`Eso no es posible debido a que operamos solo en Ibiza y Formentera y un day-charter de 8 horas no permite ir a ${c.dest} y volver, pero puedo ofrecerte la ruta premium a Es Vedrà al atardecer o Illetes en Formentera.`);
    if (c.night) p.push("Pernoctar no es posible debido a que es un chárter diurno de 8 horas, pero puedo ofrecerte terminar con la puesta de sol frente a Es Vedrà y traslado en tender a vuestra villa.");
    if (profile === "vip") p.push(`Para varias salidas te recomiendo la membresía VIP (2.900 € / temporada): tarifa de miembro desde ${MEMBER_FROM} € por plaza, sin el recargo del 40 %, y 7 días de reserva prioritaria.`);
    if (profile === "seat") p.push("Quedan plazas en las próximas salidas y te reservo la tuya ahora mismo.");
    if (profile === "lost") p.push("Si cambian vuestros planes, estaremos encantados de recibiros en Ibiza o Formentera.");
    if (c.pax == null && profile !== "lost") p.push("¿Cuántas personas seríais y qué fecha os viene mejor?");
    p.push("Un saludo,\nVesorax Concierge · WOTAN");
  } else {
    p.push("Hello, and thank you for reaching out!");
    if (c.capFail) p.push(`That isn't possible because maritime law limits our yacht to 11 guests plus the captain, but I can offer you a second boat sailing in tandem so your group of ${c.pax} stays together. Our team will send the details on WhatsApp.`);
    if (c.geoFail) p.push(`That isn't possible because we only operate in Ibiza and Formentera, and an 8-hour day charter can't reach ${c.dest} and return, but I can offer you our premium Es Vedrà sunset route or Illetes in Formentera.`);
    if (c.night) p.push("Staying overnight isn't possible because this is an 8-hour day charter, but I can offer you a sunset finish at Es Vedrà with a tender transfer back to your villa.");
    if (profile === "vip") p.push(`For several outings our VIP Membership (${eur(MEMBERSHIP_FEE)} / season) is the smart choice: member rates from ${eur(MEMBER_FROM)} per seat with no 40% surcharge, plus a 7-day priority booking window.`);
    if (profile === "seat") p.push("We still have seats on the upcoming departures and I can hold yours right now.");
    if (profile === "lost") p.push("If your plans change, we'd love to welcome you on board in Ibiza or Formentera.");
    if (c.pax == null && profile !== "lost") p.push("How many guests will join, and which date suits you best?");
    p.push("Warm regards,\nVesorax Concierge · WOTAN");
  }
  return p.join("\n\n");
}

{"summary": string, "pax": integer|null, "paxDetail": string, "profile": "vip"|"seat"|"lost", "score": integer, "alerts": {"capacity": {"ok": bool, "detail": string}, "overnight": {"ok": bool, "detail": string}, "geo": {"ok": bool, "detail": string}}, "suggestion": [3-4 short sales actions], "reply": string, "whatsapp": bool}`;

function mergeAI(r, base) {
  if (!r || typeof r !== "object") return base;
  const out = { ...base, source: "ai" };
  if (["vip", "seat", "lost"].includes(r.profile)) out.profile = r.profile;
  if (Number.isInteger(r.pax)) out.pax = r.pax;
  if (Number.isFinite(r.score)) out.score = clamp(Math.round(r.score), 0, 100);
  for (const k of ["paxDetail", "summary", "reply"]) if (r[k]) out[k] = r[k];
  if (Array.isArray(r.suggestion) && r.suggestion.length) out.suggestion = r.suggestion;
  const a = r.alerts || {};
  out.alerts = {};
  for (const k of ["capacity", "overnight", "geo"]) {
    const b = base.alerts[k], ai = a[k] || {};
    const ok = b.ok && ai.ok !== false; // hard rules always win
    out.alerts[k] = { label: b.label, ok, detail: !ok && ai.ok === false && ai.detail ? ai.detail : b.detail };
  }
  out.whatsapp = !!r.whatsapp || (out.pax != null && out.pax > CAPACITY);
  return out;
}

/* ======================================================================
   INVESTMENT CLUB MODEL (per boat, per season)
   Sources: growth audit PDF (184 sellable days, €1,500–2,000/day, marketplaces 23–26%).
   Everything else is a modelling assumption shown in the UI.
   ====================================================================== */
const MODEL = { tradDayRate: 1750, tradOcc: 0.35, tradMarketplaceShare: 0.6, marketplaceFee: 0.25, opCostPerDay: 650, fixedPerBoat: 60000, memberSeatShare: 0.55, extrasPerSeat: 30, fbPerSeat: 25, acquisition: 0.10, hqBase: 90000, hqPerBoat: 15000 };

function simulate(boats, occ, membersPerBoat) {
  const m = MODEL;
  const tradDays = SELLABLE_DAYS * m.tradOcc;
  const tradRev = tradDays * m.tradDayRate;
  const tradEbitda = tradRev - tradRev * m.tradMarketplaceShare * m.marketplaceFee - tradDays * m.opCostPerDay - m.fixedPerBoat;
  const seats = SELLABLE_DAYS * CAPACITY * occ;
  const blended = m.memberSeatShare * MEMBER_AVG + (1 - m.memberSeatShare) * DAY_AVG;
  const seatRev = seats * blended, extras = seats * m.extrasPerSeat, memb = membersPerBoat * MEMBERSHIP_FEE;
  const revBoat = seatRev + extras + memb;
  const costBoat = SELLABLE_DAYS * m.opCostPerDay + seats * m.fbPerSeat + (seatRev + extras) * m.acquisition + m.fixedPerBoat;
  const hq = m.hqBase + m.hqPerBoat * boats;
  const rev = revBoat * boats, ebitda = (revBoat - costBoat) * boats - hq;
  return {
    boats, rev, ebitda, margin: ebitda / rev, mrr: (memb * boats) / SEASON_MONTHS, monthly: rev / SEASON_MONTHS,
    seats: seats * boats, members: membersPerBoat * boats,
    trad: { rev: tradRev * boats, ebitda: tradEbitda * boats, occ: m.tradOcc }
  };
}

  }, [open]);

];
const PHOTO_LS = "vesorax-photos-v1";

async function downscale(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  const small = document.createElement("canvas");
  const k2 = Math.min(1, 900 / Math.max(c.width, c.height));
  small.width = Math.round(c.width * k2); small.height = Math.round(c.height * k2);
  small.getContext("2d").drawImage(c, 0, 0, small.width, small.height);
  return { blob, dataUrl: small.toDataURL("image/jpeg", 0.8) };
}

function useBoatPhotos(say) {
  const [photos, setPhotos] = useState({});
  const [where, setWhere] = useState("this browser");
  const cloud = useRef({ assets: null, db: null });
  useEffect(() => {
    let local = {};
    try { local = JSON.parse(localStorage.getItem(PHOTO_LS) || "{}"); } catch {}
    setPhotos(local);
    if (!(window.claude && window.claude.use)) return;
    Promise.all([window.claude.use("assets"), window.claude.use("db")]).then(async ([assets, db]) => {
      cloud.current = { assets, db };
      if (!db) return;
      try {
        const snap = await db.doc("media/boat").get();
        if (snap.exists) {
          const d = snap.data(), next = {};
          for (const s of PHOTO_SLOTS) if (d[s.id] && d[s.id].id) next[s.id] = "/_blob/" + d[s.id].id;
          setPhotos((p) => ({ ...p, ...next }));
        }
        if (assets) setWhere("the artifact (shared)");
      } catch {}
    });
  }, []);

  const save = useCallback(async (slot, file) => {
    if (!file || !file.type.startsWith("image/")) { say("That file isn't an image. Use JPG, PNG, HEIC exported as JPG, or WebP."); return; }
    try {
      const { blob, dataUrl } = await downscale(file);
      setPhotos((p) => ({ ...p, [slot]: dataUrl }));
      const { assets, db } = cloud.current;
      if (assets && db) {
        try {
          const r = await assets.upload(blob);
          const snap = await db.doc("media/boat").get();
          const cur = snap.exists ? { ...snap.data() } : {};
          cur[slot] = { id: r.id, at: Date.now() };
          await db.doc("media/boat").set(cur);
          say("Photo saved to the artifact. Everyone you share it with sees it.");
          return;
        } catch (e) { /* fall through to local save */ }
      }
      try {
        const local = JSON.parse(localStorage.getItem(PHOTO_LS) || "{}");
        local[slot] = dataUrl;
        localStorage.setItem(PHOTO_LS, JSON.stringify(local));
        say("Photo saved in this browser.");
      } catch { say("Photo shown, but this browser blocked saving it. It will reset on reload."); }
    } catch { say("Couldn't read that image. Try a JPG or PNG screenshot."); }
  }, [say]);

  const reset = useCallback(async (slot) => {
    setPhotos((p) => { const n = { ...p }; delete n[slot]; return n; });
    try { const local = JSON.parse(localStorage.getItem(PHOTO_LS) || "{}"); delete local[slot]; localStorage.setItem(PHOTO_LS, JSON.stringify(local)); } catch {}
    const { db } = cloud.current;
    if (db) { try { const snap = await db.doc("media/boat").get(); if (snap.exists) { const cur = { ...snap.data() }; delete cur[slot]; await db.doc("media/boat").set(cur); } } catch {} }
  }, []);
  return { photos, save, reset, where };
}

const reducedMotion = () => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } };

function conciergeReply(q, s) {
  const t = " " + norm(q).replace(/[?!.,;]/g, " ") + " ";
  const hit = (arr) => arr.some((k) => t.includes(k));
  const dep = s.departures.find((d) => d.id === s.depId);
  const parts = [], actions = [];

  // --- detect the group size ---
  const info = detectPax(t);
  let n = info ? info.n : null;
  const bare = t.match(/\b(1[2-9]|[2-9]\d)\b(?!\s*(kn|knot|kts|h |hours|m |%|ltr|l |hp|eur|euro|€|nm))/);
  if (bare && (n == null || n < +bare[1]) && hit(["people", "pax", "guest", "group", "friend", "person", "personas", "of us", "book for", "for ", "amigos"])) n = +bare[1];

  const geo = OUT_ZONE.filter((k) => t.includes(" " + k) || t.includes(k + " "));
  const night = hit(["sleep", "overnight", "night", "dormir", "noche", "hotel", "stay on board", "stay aboard", "cabins", "pernoct", " stay "]);
  const capKw = hit(["big group", "more than 11", "capacity", "how many people", "how many guests", "max people", "maximum", "large group", "aforo", "people", "pax", "tandem"]);
  const founders = hit(["founder", "tagomago", "networking", "expensive", "starlink", " vcs", " vc "]);
  const pricing = founders || hit(["price", "cost", "how much", " vip", "member", "surcharge", " rates", " fee", "cheap", "discount", "€", "euro", " pay", "precio"]);
  const specsStrong = hit(["spec", "engine", "speed", "size", "length", "music", "sound", "audio", "bathroom", "toilet", "cabin", " beam", "knots", " fast", "fuel", "mercury", "horsepower", " hp", "fridge"]);
  const extras = hit(["seabob", "e-foil", "efoil", " foil", " toys", "paddle", "snorkel", "included", "include", "towel", "drinks"]);
  const routes = hit(["route", "where do", "where can", "illetes", "vedra", "beach club", "itinerar", "destination", "juan y andrea", "beso", "cala "]);
  const booking = hit(["available", "availability", "seats left", "this week", "free seat", "reserve", "which date", "when "]);
  const hello = hit([" hi ", " hello", " hey ", " hola", "good morning", "good evening", "buenas"]);
  const capFail = n != null && n > CAPACITY;
  const specs = specsStrong || (!geo.length && !night && !capFail && !pricing && hit(["boat", "yacht", "fjord", "xpress", "wotan"]));

  if (geo.length) {
    const dest = geo.map(cap1).join(" and ");
    parts.push(`That isn't possible because WOTAN runs 8-hour day charters strictly within Ibiza and Formentera. ${dest} is too far to sail there and back safely and still enjoy the day. I can offer you the Es Vedrà Sunset Session or a full day at Illetes in Formentera instead: turquoise water and beach clubs reached by our private tender.`);
    const illetes = s.departures.find((d) => d.tier === "dayclub");
    if (illetes) actions.push({ type: "dep", id: illetes.id, label: "See seats on " + illetes.name });
  }
  if (capFail) {
    parts.push(`We'd love to host all ${n} of you, but maritime law caps the Fjord 38 Xpress at 11 guests plus the skipper, with no exceptions. That isn't possible on one boat, but I can offer you our 2-boat tandem: a second yacht sails alongside on the same route and timing, so your group anchors, swims and has lunch together all day. Our team closes tandem bookings on WhatsApp in a few minutes.`);
    actions.push({ type: "whatsapp", label: "Continue on WhatsApp with our team", text: `Hi WOTAN team, we're a group of ${n} and would like a 2-boat tandem quote${geo.length ? " (Es Vedrà or Illetes instead of " + geo.map(cap1).join("/") + ")" : ""}.` });
  } else if (capKw && !geo.length) {
    const left = CAPACITY - dep.occupied.length;
    parts.push(`Each departure takes up to 11 guests plus the skipper, by maritime law.${n ? ` A group of ${n} fits on one boat.` : ""} Right now ${dep.name} has ${left} seat${left === 1 ? "" : "s"} left. For groups of 12 or more we run a 2-boat tandem.`);
  }
  if (night) {
    parts.push("Sleeping on board isn't possible: WOTAN is an 8-hour day charter between 10:30 and 20:30, and overnight stays are never allowed. The cabin with its full bathroom is there for changing and resting during the day. What I can offer you is a stay at one of our partner luxury villas in Cala Jondal or Es Cubells, with our tender picking you up from the villa the next morning.");
  }
  if (specs) {
    parts.push("WOTAN is a 2020 Fjord 38 Xpress moored at Marina Port Ibiza: German build, Scandinavian design.\n– Length 11.63 m · beam 3.64 m\n– Twin 300 hp Mercury engines (600 hp combined)\n– Up to 40 knots, 26 knots cruising, about 120 L/h\n– Fusion zoned Bluetooth sound system\n– Retractable sun canopies at bow and stern, plus T-top shade at the helm\n– Bow sunbed, large aft sundeck with a convertible table for 8, 3 refrigerators, outdoor shower and swim platform\n– Cabin with a full bathroom\nCapacity: 11 guests plus the skipper.");
  }
  if (founders) {
    const f = EVENT_TIERS.founders;
    parts.push(`The Tagomago Founders Run is our high-ticket networking day: a private, curated mastermind at sea for tech founders, VCs and villa owners. It includes a networking lunch in Tagomago, a premium open bar and Starlink high-speed Wi-Fi on board. Guests are curated and 85% of seats are held by VIP Club members, which is why it's ${eur(f.member)} per seat for members and ${eur(f.day)} as a day pass.`);
  }
  if (pricing) {
    if (!founders) {
      const rows = Object.values(EVENT_TIERS).map((x) => `– ${x.label}: ${eur(x.member)} member · ${eur(x.day)} day pass`).join("\n");

  }
  if (extras) {
    parts.push("Included on every trip: towels, snorkel gear, paddle surf, complimentary drinks, port taxes, insurance and final cleaning.\nExtras on request: Seabob €320/day, E-foil €500/day and premium drinks.");
  }
  if (routes && !geo.length) {
    parts.push("Favourite routes from Marina Port Ibiza:\n– Formentera · Illetes: Juan y Andrea, Beso, Es Ministre\n– Formentera · Levante and Es Pujols\n– Ibiza South: Cala Jondal, Salinas, Cala Pluma\n– Ibiza South · Es Vedrà via Cala Jondal\n– Formentera · Cala Saona\nEvery route fits within our 8-hour day charter.");
  }
  if (!parts.length && booking) {
    const rows = s.departures.map((d) => `– ${fmtDate(d.date)} · ${d.name}: ${CAPACITY - d.occupied.length} seats left · ${eur(d.member)} member / ${eur(dayPassOf(d, s.priceBoost))} day pass`).join("\n");

    actions.push({ type: "dep", id: dep.id, label: "Choose my seats" });
  }
  if (!parts.length && hello) parts.push("Hello, and welcome aboard. I can help with the Fjord 38 Xpress, this week's events and prices, the VIP Membership or group bookings. What would you like to know?");
  if (!parts.length) parts.push("I can help with the Fjord 38 Xpress specs, event prices, the VIP Membership, routes and extras, or bookings for groups of any size. Try one of the questions below, or ask me in your own words.");
  return { text: parts.join("\n\n"), actions };
}

function StreamText({ text, done, onTick }) {
  const [n, setN] = useState(done ? text.length : 0);
  useEffect(() => {
    if (done || reducedMotion()) { setN(text.length); return; }
    const step = Math.max(2, Math.ceil(text.length / 70));
    const id = setInterval(() => setN((v) => { const nx = Math.min(text.length, v + step); if (nx >= text.length) clearInterval(id); return nx; }), 18);
    return () => clearInterval(id);
  }, [text]);
  useEffect(() => { onTick && onTick(n >= text.length); }, [n]);
  return html`<span>${text.slice(0, n)}</span>`;
}

function Spark({ data, color = "#8B93FF" }) {
  const w = 240, h = 52, min = Math.min(...data) * 0.97, max = Math.max(...data) * 1.01;
  const pts = data.map((v, i) => [i * (w / (data.length - 1)), h - ((v - min) / (max - min)) * (h - 6) - 3]);
  const line = pts.map((p) => p.join(",")).join(" "), last = pts[pts.length - 1];
  return html`<svg viewBox=${`0 0 ${w} ${h}`} className="w-full h-12" aria-hidden="true">
    ${[0.33, 0.66].map((f) => html`<line key=${f} x1="0" x2=${w} y1=${h * f} y2=${h * f} stroke="#1F222B" />`)}
    <polygon points=${`0,${h} ${line} ${w},${h}`} fill=${color} fillOpacity="0.12" />
    <polyline points=${line} fill="none" stroke=${color} strokeWidth="2" strokeLinejoin="round" />
    <circle cx=${last[0]} cy=${last[1]} r="3.5" fill=${color} stroke="#111318" strokeWidth="2" />
  </svg>`;
}

function pricingAdvice(departures, boost) {
  const occ = departures.map((d) => ({ d, o: d.occupied.length / CAPACITY })).sort((x, y) => y.o - x.o);
  const top = occ.slice(0, 3), hot = top.reduce((x, y) => x + y.o, 0) / top.length;
  const avg = occ.reduce((x, y) => x + y.o, 0) / occ.length;
  let pct = 0, why;
  if (hot >= 0.75) { pct = 20; why = `high demand: top departures at ${Math.round(hot * 100)}% (${top.map((t) => t.d.short).join(", ")})`; }
  else if (hot >= 0.6) { pct = 10; why = `steady demand at ${Math.round(hot * 100)}% on the busiest days`; }
  else if (avg <= 0.4) { pct = -15; why = `low occupancy (${Math.round(avg * 100)}%): run a 48 h flash offer`; }
  else why = "demand is balanced, hold the price";
  const ex = top[0].d;
  return { pct, why, avg, ex, from: dayPassOf(ex, 0), to: dayPassOf(ex, pct), applied: boost !== 0 };
}

function ScoreRing({ score }) {
  const t = tierOf(score), col = t === "whale" ? "#FBBF24" : t === "mid" ? "#7DD3FC" : "#FDA4AF";

  return html`<svg width="44" height="44" viewBox="0 0 44 44" aria-label=${"Lead score " + score}>
    <circle cx="22" cy="22" r=${r} fill="none" stroke="#1F222B" strokeWidth="4"/>
    <circle cx="22" cy="22" r=${r} fill="none" stroke=${col} strokeWidth="4" strokeDasharray=${`${(score / 100) * c} ${c}`} strokeLinecap="round" transform="rotate(-90 22 22)"/>
    <text x="22" y="26" textAnchor="middle" fontSize="12" fontWeight="600" fill="#E6E8EE" fontFamily="Geist Mono, ui-monospace, monospace">${score}</text></svg>`;
}

function InvestmentClub() {
  const [boats, setBoats] = useState(1);
  const [occ, setOcc] = useState(82);
  const [members, setMembers] = useState(25);
  const r = simulate(boats, occ / 100, members);
  const series = Array.from({ length: 10 }, (_, i) => simulate(i + 1, occ / 100, members));
  const maxV = Math.max(...series.map((x) => x.ebitda), 1), minV = Math.min(0, ...series.map((x) => x.trad.ebitda));
  const W = 560, H = 200, pad = 28, bw = (W - pad) / 10;
  const y = (v) => H - 20 - ((v - minV) / (maxV - minV)) * (H - 40);
  const kpis = [
    ["MRR · memberships", eur(r.mrr), `${r.members} members × ${eur(MEMBERSHIP_FEE)} / ${SEASON_MONTHS} mo`],
    ["Avg. occupancy", occ + "%", `vs ${Math.round(MODEL.tradOcc * 100)}% traditional charter`],
    ["Season revenue", eurK(r.rev), `${eurK(r.monthly)} / month run-rate`],
    ["EBITDA", eurK(r.ebitda), `${Math.round(r.margin * 100)}% margin · trad. ${eurK(r.trad.ebitda)}`]
  ];
  return html`
    <div className="flex flex-col gap-4">
      <section className=${card + " p-5"}>
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div><p className=${kicker}>Investment Club · fleet simulator</p><h3 className="text-xl font-semibold text-white mt-1">Scale from 1 to 10 Fjord 38 Xpress</h3></div>
          <p className="text-4xl font-semibold text-white tabnum">${boats} <span className="text-base text-[#8A90A0] font-normal">boat${boats > 1 ? "s" : ""}</span></p>
        </div>
        <input id="boats" type="range" min="1" max="10" value=${boats} onInput=${(e) => setBoats(+e.target.value)} className="w-full mt-4" aria-label="Number of boats" />
        <div className="flex justify-between text-[11px] font-mono text-[#5C6170] mt-1">${Array.from({ length: 10 }, (_, i) => html`<span key=${i}>${i + 1}</span>`)}</div>
        <div className="grid sm:grid-cols-2 gap-4 mt-5">
          <label className="text-sm text-[#C9CDD8]" htmlFor="occ">Yacht Club seat occupancy <b className="text-white tabnum">${occ}%</b>
            <input id="occ" type="range" min="50" max="95" value=${occ} onInput=${(e) => setOcc(+e.target.value)} className="w-full mt-1" /></label>
          <label className="text-sm text-[#C9CDD8]" htmlFor="mem">Members per boat <b className="text-white tabnum">${members}</b>
            <input id="mem" type="range" min="0" max="100" step="5" value=${members} onInput=${(e) => setMembers(+e.target.value)} className="w-full mt-1" /></label>
        </div>
      </section>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        ${kpis.map(([k, v, sub], i) => html`<div key=${k} className=${card + " p-4"}><p className=${kicker}>${k}</p><p className=${"text-2xl font-semibold tabnum mt-1 " + (i === 3 ? (r.ebitda >= 0 ? "text-emerald-400" : "text-rose-400") : "text-white")}>${v}</p><p className="text-[11px] text-[#5C6170] mt-0.5">${sub}</p></div>`)}
      </div>
      <section className=${card + " p-5"}>
        <div className="flex flex-wrap justify-between items-baseline gap-2"><p className=${kicker}>EBITDA per season by fleet size</p>
          <div className="flex gap-4 text-[11px] text-[#8A90A0]"><span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-sm bg-[#8B93FF]"></i>Public Yacht Club</span><span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-sm bg-[#5C6170]"></i>Traditional charter</span></div></div>
        <div className="overflow-x-auto"><svg viewBox=${`0 0 ${W} ${H}`} className="w-full min-w-[480px] mt-3" role="img" aria-label="EBITDA by fleet size">
          <line x1=${pad} x2=${W} y1=${y(0)} y2=${y(0)} stroke="#2A2E3A" />
          <text x="0" y=${y(0) + 4} fontSize="9" fill="#5C6170" fontFamily="Geist Mono, ui-monospace, monospace">€0</text>
          <text x="0" y=${y(maxV) + 8} fontSize="9" fill="#5C6170" fontFamily="Geist Mono, ui-monospace, monospace">${eurK(maxV)}</text>
          ${series.map((p, i) => { const x = pad + i * bw + 4, on = i + 1 === boats; const yc = y(Math.max(p.ebitda, 0)), yt0 = y(0), yt = y(p.trad.ebitda); return html`<g key=${i} onClick=${() => setBoats(i + 1)} style=${{ cursor: "pointer" }}>
            <rect x=${x} y=${Math.min(yc, yt0)} width=${bw / 2 - 4} height=${Math.max(1, Math.abs(yt0 - yc))} rx="2" fill="#8B93FF" fillOpacity=${on ? 1 : 0.35} />
            <rect x=${x + bw / 2 - 2} y=${Math.min(yt, yt0)} width=${bw / 2 - 4} height=${Math.max(1, Math.abs(yt0 - yt))} rx="2" fill="#5C6170" fillOpacity=${on ? 1 : 0.5} />
            <text x=${x + bw / 2 - 4} y=${H - 4} textAnchor="middle" fontSize="10" fill=${on ? "#fff" : "#5C6170"} fontFamily="Geist Mono, ui-monospace, monospace">${i + 1}</text>
            ${on && html`<text x=${x + bw / 4} y=${yc - 6} textAnchor="middle" fontSize="10" fill="#fff" fontFamily="Geist Mono, ui-monospace, monospace">${eurK(p.ebitda)}</text>`}
          </g>`; })}
        </svg></div>
      </section>
      <details className=${card + " p-4 text-xs text-[#8A90A0]"}>
        <summary className="cursor-pointer text-[#C9CDD8] font-medium">Model assumptions</summary>
        <ul className="mt-3 grid sm:grid-cols-2 gap-x-6 gap-y-1.5 list-disc pl-4">
          <li><b className="text-[#C9CDD8]">From the growth audit PDF:</b> ${SELLABLE_DAYS} sellable days (May–Oct), private day rate €1,500–2,000 (model: ${eur(MODEL.tradDayRate)}), marketplace commission 23–26% (model: 25% on 60% of bookings).</li>
          <li>Traditional occupancy ${Math.round(MODEL.tradOcc * 100)}% of days; Yacht Club occupancy is seat-based.</li>
          <li>Seat mix: ${Math.round(MODEL.memberSeatShare * 100)}% member seats at an average ${eur(MEMBER_AVG)}, the rest at an average day pass of ${eur(DAY_AVG)} (this week's event mix); extras ${eur(MODEL.extrasPerSeat)} per seat.</li>
          <li>Costs per boat: skipper, fuel and cleaning ${eur(MODEL.opCostPerDay)}/day; mooring, insurance and maintenance ${eurK(MODEL.fixedPerBoat)}/season; F&B ${eur(MODEL.fbPerSeat)}/seat; acquisition 10% of seat revenue.</li>
          <li>Club HQ (team + WOTAN software): ${eurK(MODEL.hqBase)} + ${eurK(MODEL.hqPerBoat)} per boat. EBITDA excludes boat depreciation and financing.</li>
          <li>All figures except the PDF inputs are simulation assumptions, not WOTAN actuals.</li>
        </ul>
      </details>
    </div>`;
}

    document.body.classList.toggle("biz", mode === "biz");
    document.documentElement.style.colorScheme = mode === "biz" ? "dark" : "light";
    window.scrollTo({ top: 0 });
  }, [mode]);

  useEffect(() => {
    const v = setInterval(() => up((x) => ({ viewers: clamp(x.viewers + (Math.random() < 0.5 ? -1 : 1), 3, 9) })), 5000);
    const f = setInterval(() => up((x) => ({ leadsProcessed: x.leadsProcessed + (Math.random() < 0.6 ? 1 : 0), activity: log(x, ACTIVITY_POOL[Math.floor(Math.random() * ACTIVITY_POOL.length)]) })), 9000);
    return () => { clearInterval(v); clearInterval(f); };
  }, []);

  const pushMrr = (x, members) => ({ members, mrrHistory: [...x.mrrHistory.slice(1), (members * MEMBERSHIP_FEE) / SEASON_MONTHS] });
  const actions = {
    setDep: (id) => up(() => ({ depId: id, viewers: 5 })),
    setBoost: (p) => { up((x) => ({ priceBoost: p, activity: log(x, p ? `Day passes ${p > 0 ? "+" : ""}${p}% by dynamic pricing` : "Day passes back to list price") })); say(p ? `Client Mode day passes are now ${p > 0 ? "+" : ""}${p}%` : "Client Mode day passes are back to list price"); },
    join: () => { up((x) => (x.isMember ? {} : { isMember: true, ...pushMrr(x, x.members + 1), activity: log(x, `New VIP member · +${eur(MEMBERSHIP_FEE)} season fee`) })); say("Welcome to the club. Member rates are now active on every event."); },
    book: (depId, seats, unit) => {
      up((x) => ({
        departures: x.departures.map((d) => (d.id === depId ? { ...d, occupied: [...d.occupied, ...seats.map((seat) => ({ seat, p: "couples" }))] } : d)),
        revenueToday: x.revenueToday + seats.length * unit,
        activity: log(x, `${seats.length} seat${seats.length > 1 ? "s" : ""} booked · ${eur(seats.length * unit)}`)
      }));
      say(`Booked. ${seats.length} seat${seats.length > 1 ? "s" : ""} reserved. See it live in Business Mode.`);
    },
    addLead: (text, r) => up((x) => ({
      leadsProcessed: x.leadsProcessed + 1,
      leads: [{ id: Date.now(), channel: "Pasted", who: "New lead", time: nowHM(), text, profile: r.profile, pax: r.pax, alerts: Object.values(r.alerts).filter((q) => !q.ok).length }, ...x.leads].slice(0, 10),
      activity: log(x, `Lead processed · ${LEAD_PROFILES[r.profile].short} · score ${r.score}${r.whatsapp ? " · WhatsApp hand-off" : ""}`)
    })),
    addClient: (text, r) => {
      const id = "n" + Date.now();
      const kind = r.alerts.capacity.ok ? (r.profile === "lost" ? "nurture" : r.profile === "vip" ? "upgrade" : "referral") : "tandem";
      const client = { id, name: "New lead " + nowHM(), initials: "NL", origin: "Unknown", age: null, profession: "To qualify", worth: "Unknown", capacity: "Unknown", stay: "Unknown", partner: null, channel: "Pasted message", score: r.score, member: false, vibe: "Unknown",
        history: [{ date: new Date().toISOString().slice(0, 10), desc: "Inquiry · " + text.slice(0, 80) + (text.length > 80 ? "…" : ""), amount: 0 }], prior: 0, cac: 25, surchargeMonth: 0,
        nba: { prob: clamp(r.score - 10, 5, 95), kind, title: r.suggestion[0] ? "Next step" : "Qualify", text: r.suggestion.join(" ") } };
      up((x) => ({ clients: [client, ...x.clients], activity: log(x, `Lead saved to CDP · score ${r.score}`) }));
      say("Saved to the CDP. Open the CDP tab to see the card.");
    }
  };

  return html`
    <div className="min-h-screen">
      <${TopToggle} mode=${mode} setMode=${setMode} />
      ${mode === "biz" ? html`<${BusinessView} s=${s} a=${actions} say=${say} />` : html`<${ClientView} s=${s} a=${actions} say=${say} />`}
      <${Toast} msg=${toast} biz=${mode === "biz"} />
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>

</body>
</html>
